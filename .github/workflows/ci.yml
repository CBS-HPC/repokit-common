name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Windows-specific PATH and registry branches are covered on Windows;
      # every OS still runs the full suite and produces a coverage report.
      - run: pytest --cov=repokit_common --cov-report=term-missing --cov-fail-under=80
        if: runner.os == 'Windows'
      - run: pytest --cov=repokit_common --cov-report=term-missing --cov-fail-under=0
        if: runner.os != 'Windows'
      - run: python -m build
      - run: twine check dist/*
