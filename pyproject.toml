[build-system]
requires = [
    "setuptools>=65",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "repokit-common"
version = "0.1"
description = "Shared utilities for Repokit"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "CBS-HPC"}]
keywords = ["research", "reproducibility", "automation", "data-management"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
    "python-dotenv",
    "pathspec",
    "PyYAML",
    "requests",
    "toml ; python_version < \"3.11\"",
    "tomli-w ; python_version >= \"3.11\"",
]

requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/CBS-HPC/repokit-common"
Repository = "https://github.com/CBS-HPC/repokit-common"
Issues = "https://github.com/CBS-HPC/repokit-common/issues"


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
    "uv",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.datasets]
patterns = "C:\\data\\*"
