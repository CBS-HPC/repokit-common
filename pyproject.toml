[build-system]
requires = [
    "setuptools>=65",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "repokit-common"
version = "1.0.0"
description = "Shared utilities for Repokit"
readme = "README.md"
authors = [
    { name = "CBS-HPC" },
]
keywords = [
    "research",
    "reproducibility",
    "automation",
    "data-management",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv>=1.0",
    "pathspec>=0.12",
    "toml>=0.10 ; python_version < \"3.11\"",
    "tomli-w>=1.0 ; python_version >= \"3.11\"",
    "tomlkit>=0.13",
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/CBS-HPC/repokit-common"
Repository = "https://github.com/CBS-HPC/repokit-common"
Issues = "https://github.com/CBS-HPC/repokit-common/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-toml",
    "uv",
    "pytest-cov>=5",
    "build>=1.2",
    "twine>=6",
]
secrets = [
    "keyring",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep CI stable across Ruff releases and enforce the project's baseline checks.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.datasets]
patterns = ""

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
exclude = '(^\.venv/|^build/|^dist/)'

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["repokit_common"]

[tool.coverage.report]
fail_under = 80
show_missing = true
